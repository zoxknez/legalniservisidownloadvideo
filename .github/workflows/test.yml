name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run pytest
        run: python -m pytest tests/ -q
      - name: Ensure build artifacts are not tracked
        run: |
          if git ls-files --error-unmatch backend/static/index.html 2>/dev/null; then
            echo "::error::backend/static/index.html must not be committed — run npm run build locally only"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Verify UI build output
        run: test -f ../backend/static/index.html
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
